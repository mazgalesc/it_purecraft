# pdf.madweb.it — PDFCraft for madweb.it accounts.
#
# STAGE (2026-09-04): /api is live; the app itself is a "coming soon" placeholder.
# When the app + login wall ship, this vhost gains the static root swap and the
# auth gate (see PDFCRAFT-cloud-app.md §2.4 nginx deltas). Additive to the main
# madweb.it vhost (exact server_name wins over its *.madweb.it wildcard).
#
# NOTE: host has no IPv6 — no [::] listeners (parity with madweb.it).

server {
    listen 80;
    server_name pdf.madweb.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pdf.madweb.it;

    ssl_certificate     /etc/letsencrypt/live/madweb.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madweb.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /srv/pdfcraft/site;
    index index.html;

    client_max_body_size 60m;   # PDFCRAFT_MAX_FILE_SIZE (50 MiB) + margin

    # ---- cloud API: every /api/* request hits the front controller ---------
    # SCRIPT_FILENAME is absolute and lives OUTSIDE the docroot, so no file under
    # /api can ever be served raw. fastcgi_params (not the Ubuntu snippet) is
    # used deliberately: the snippet's try_files resolves against $document_root.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/pdfcraft/api/index.php;
        fastcgi_param SCRIPT_NAME     /api/index.php;
        fastcgi_param HTTPS           on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass  unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300;
    }

    # ---- static (placeholder now; real export later) ------------------------
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff;
    }
}
