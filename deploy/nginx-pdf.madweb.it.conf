# pdf.madweb.it — PDFCraft for madweb.it accounts (production vhost).
#
# Serves the statically exported fork (/srv/pdfcraft/out, Italian-first) plus
# the cloud API (/srv/pdfcraft/api — OUTSIDE the docroot). The login wall is
# enforced client-side in the app (SessionGuard) and backed by the API's WP
# session-cookie auth; the same-origin cookie makes SSO with madweb.it native.
#
# Additive to the main madweb.it vhost (exact server_name wins over wildcard).
# Host has no IPv6 — no [::] listeners (parity with madweb.it).
#
# Rollback: previous app export is kept at /srv/pdfcraft/out.prev — swap dirs,
# or disable this site entirely; WP is never touched.

server {
    listen 80;
    server_name pdf.madweb.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pdf.madweb.it;

    ssl_certificate     /etc/letsencrypt/live/madweb.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madweb.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /srv/pdfcraft/out;
    index index.html;

    client_max_body_size 60m;   # uploads cap (PDFCRAFT_MAX_FILE_SIZE 50 MiB + margin)

    # NOTE: no `types {}` here — a types block REPLACES the inherited mime map
    # (which would turn html/js/css into application/octet-stream). Defaults
    # apply; the wasm mapping is added only where needed (see below).

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # Cross-origin isolation — required by the LibreOffice-WASM converters
    # (SharedArrayBuffer/pthreads). Document-level, but asset locations that
    # define their own add_header must repeat them (nginx inheritance rule).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # ---- cloud API: every /api/* request hits the front controller ---------
    # SCRIPT_FILENAME is absolute and lives outside the docroot, so no file
    # under /api can ever be served raw. fastcgi_params is used deliberately
    # (the Ubuntu snippet's try_files would resolve against $document_root).
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/pdfcraft/api/index.php;
        fastcgi_param SCRIPT_NAME     /api/index.php;
        fastcgi_param HTTPS           on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass  unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300;
    }

    # ---- document requests (HTML) — no cache + noindex (login wall) ---------
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ---- hashed app assets — long cache (names change per build) ------------
    location ^~ /_next/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- LibreOffice WASM (chunked, .gz variants present) -------------------
    # Chunks are fetched as blobs, but map .wasm properly for direct requests.
    # (Location-scoped types only affect requests under this prefix.)
    location ^~ /libreoffice-wasm/ {
        gzip_static on;
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- static tool data / pdf.js helpers (hashed or build-pinned) ---------
    location ~* \.(js|css|mjs|json|wasm|pdf|png|jpg|jpeg|webp|svg|woff2?|ico|bin|gz)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker must never be cached.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
